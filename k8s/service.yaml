apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: my-flask-app  # Must match your deployment's selector/labels
  ports:
    - protocol: TCP
      port: 80         # Port exposed externally
      targetPort: 5000 # Port your Flask app runs on inside the container